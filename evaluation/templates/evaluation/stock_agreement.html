<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Options Agreement - Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6 relative overflow-x-hidden">
    <!-- Ambient Glow Background -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-cyan-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative w-full max-w-3xl bg-slate-900/40 backdrop-blur-2xl border border-white/10 p-8 md:p-12 rounded-3xl shadow-[0_8px_32px_0_rgba(0,0,0,0.37)]">
        <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
            <div>
                <span class="text-xs uppercase tracking-widest text-cyan-400 font-semibold">Step 2 of 3</span>
                <h1 class="text-3xl font-extrabold text-white mt-1">Stock Option Agreement</h1>
            </div>
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl text-xs font-semibold transition">Logout</button>
            </form>
        </div>

        <div class="prose prose-invert max-w-none text-slate-300 leading-relaxed space-y-4 mb-8 bg-slate-950/40 p-6 rounded-2xl border border-white/5 shadow-inner whitespace-pre-line max-h-64 overflow-y-auto">
            {{ profile.stock_agreement_text }}
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 hover:to-indigo-500 text-white font-semibold py-4 rounded-2xl shadow-lg shadow-cyan-600/30 transition duration-300">
                Sign & Proceed to NDA →
            </button>
        </form>
    </div>
</body>
</html>
