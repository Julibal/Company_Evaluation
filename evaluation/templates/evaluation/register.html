<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Company Evaluation</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center h-screen">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-96 border border-slate-700">
        <h2 class="text-2xl font-bold mb-2 text-center text-indigo-400">Onboarding</h2>
        <p class="text-xs text-slate-400 mb-6 text-center">Invited: <strong class="text-slate-200">{{ invitation.email }}</strong></p>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 font-semibold py-2 rounded-lg transition">Complete Registration</button>
        </form>
    </div>
</body>
</html>
